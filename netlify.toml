[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/result"
  to = "/.netlify/functions/api/result"
  status = 200

[[redirects]]
  from = "/result/*"
  to = "/.netlify/functions/api/result/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
